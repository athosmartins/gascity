description = """
Generate activity digest for the mayor.

After claiming this vapor wisp, run:

```bash
gc bd formula show mol-digest-generate --json
```

Follow the step descriptions in order. When finished, close this bead, then run:

```bash
gc runtime drain-ack
```

The drain-ack tells the controller this session is done.

This is a **periodic formula** — dispatched by the deacon's
`periodic-formulas` step when the cooldown trigger elapses. Configured
in `city.toml` under `[formulas]`:

```toml
[[formulas.periodic]]
formula = "mol-digest-generate"
trigger = "cooldown"
interval = "24h"
pool = "dog"
```

The deacon checks if enough time has passed since the last run
(tracked via `type:order-run` beads), pours a wisp, and labels it
for the dog pool. A dog picks it up and runs this formula.

## What it produces

A formatted markdown digest covering:
- Issues filed and closed (by rig, by type)
- Merge activity
- Incidents and escalations
- Agent health summary
- Trends (backlog direction, throughput)

The digest is mailed to the mayor and archived as a digest bead.

Read each step's description before acting — Config values override defaults."""
formula = "mol-digest-generate"
phase = "vapor"

[vars]
[vars.period]
description = "The digest period type (daily, weekly)"
default = "daily"

[vars.event_timeout]
description = "Seconds to wait for slow queries before giving up"
default = "30"

[[steps]]
id = "determine-period"
title = "Determine digest time range"
description = """
Establish the time range for this digest.

**1. Determine period type:**
Use {{period}} (from formula vars, defaults to "daily").

**2. Calculate time range:**

| Period | Since | Until |
|--------|-------|-------|
| daily | Yesterday 00:00 UTC | Today 00:00 UTC |
| weekly | Last Monday 00:00 UTC | This Monday 00:00 UTC |

```bash
# For daily:
SINCE=$(date -u -d 'yesterday 00:00' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
        date -u -v-1d -j -f '%H:%M' '00:00' +%Y-%m-%dT%H:%M:%SZ)
UNTIL=$(date -u -d 'today 00:00' +%Y-%m-%dT%H:%M:%SZ 2>/dev/null || \
        date -u -j -f '%H:%M' '00:00' +%Y-%m-%dT%H:%M:%SZ)
```

Note the timestamps for the digest header.

Continue to data collection when the time range is established."""

[[steps]]
id = "collect-data"
title = "Collect activity data from all rigs"
description = """
Gather activity data from each rig.

**1. List rigs:**
```bash
gc rig list
```

**2. For each rig, collect:**

a) **Issues filed and closed** — bounded on both ends, [SINCE, UNTIL). A
`--created-after` with no `--created-before`/`--closed-before` silently
extends the window through "now", inflating counts by whatever fraction of
today has already elapsed (ga-swvjo: measured ~40% inflation from this
exact gap on the live town-deltas override of this formula):
```bash
gc bd list --created-after=$SINCE --created-before=$UNTIL --json --limit=0
gc bd list --status=closed --closed-after=$SINCE --closed-before=$UNTIL --json --limit=0
```

b) **Commit activity** — also bounded, or today's not-yet-elapsed commits
bleed in. Not `--merges`: gate-workflow-driven cities commonly land via
fast-forward/squash, never a 2-parent merge commit, so a `--merges` query
can structurally return 0 on every rig, always, regardless of real
activity (ga-x3b4ro, confirmed live on the town-deltas override of this
formula: a 14+64-real-commit day still measured 0 merges — a digest
reporting "Merges: 0" then reads as "nothing shipped" when the opposite is
true). Count plain commits instead:
```bash
LOG_OUT=$(git -C <rig-path> log --since=$SINCE --until=$UNTIL --oneline main)
# Check git log's own exit status with NO pipe in between -- piping
# straight into `wc -l` and checking $? after reflects wc's exit status,
# not git log's, so a failed git log and a genuinely quiet rig would both
# read as "0" (empty pipeline output either way).
if [ $? -ne 0 ]; then
  COMMIT_COUNT="?"
elif [ -z "$LOG_OUT" ]; then
  COMMIT_COUNT=0
else
  COMMIT_COUNT=$(printf '%s\n' "$LOG_OUT" | wc -l | tr -d ' ')
fi
```
A failed `git log` above renders `COMMIT_COUNT="?"`, never `0` — a failed
command and a genuinely quiet rig must never collapse into the same
number. If a rig shows `?`, say so in Highlights instead of asserting no
activity happened.

c) **Incidents:**
```bash
gc bd list --label=incident --created-after=$SINCE --json
```

**3. Collect town-level data:**

a) **Session lifecycle events:**
```bash
gc events --since=$SINCE --type=session.woke,session.stopped,session.crashed --json
```

b) **Escalations:**
```bash
gc bd list --label=escalation --created-after=$SINCE --json
```

c) **Warrants filed:**
```bash
gc bd list --label=warrant --created-after=$SINCE --json
```

Continue to digest generation when all data is collected."""

[[steps]]
id = "generate-and-send"
title = "Generate digest, send to mayor, archive"
description = """
Transform data into a formatted digest and deliver it.

**1. Generate digest markdown:**

```markdown
# Gas Town {{period}} Digest: {{date}}

## Summary
- **Issues filed**: N (tasks: X, bugs: Y)
- **Issues closed**: N
- **Net change**: +/-N

## By Rig
| Rig | Filed | Closed | Commits |
|-----|-------|--------|---------|
| ... | ...   | ...    | ...     |

## Highlights
- Notable completions
- Incidents (if any)

## Agent Health
- Agents started/stopped/crashed: N/N/N
- Warrants filed: N (pardoned: X, executed: Y)

## Trends
- Backlog: increasing / stable / decreasing
- Throughput: N issues/day
```

**2. Send to mayor:**
```bash
gc mail send mayor/ -s "Gas Town Digest: $DATE" -m "$DIGEST"
```

**3. Archive as bead:**
```bash
gc bd create --type=task \
  --title="Digest: $DATE" \
  --label=digest,{{period}}
```

**4. Close work bead, signal reconciler, and exit:**
```bash
gc bd close <work-bead> --reason "Digest generated and sent"
gc runtime drain-ack
exit
```

The deacon records this run via a `type:order-run` bead for cooldown
tracking on the next patrol cycle."""
